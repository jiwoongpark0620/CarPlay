<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CarPlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd;
    font: 18px/1.4 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #picture { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    pointer-events: none; -webkit-user-drag: none; }
  .hidden { display: none !important; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%;
    padding: 18px 26px; border-radius: 14px; background: rgba(40,40,40,.85); text-align: center;
    pointer-events: none; white-space: pre-line; }
  #log { position: fixed; right: 8px; bottom: 8px; max-width: 70%; max-height: 70%; overflow: auto; margin: 0;
    padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.7); color: #fc6;
    font: 12px/1.3 ui-monospace, monospace; pointer-events: none; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div id="stage"><img id="picture" class="hidden" alt="" draggable="false"></div>
<div id="msg">어댑터 연결 중…</div>
<script src="js/link.js"></script>
<script src="js/client.js"></script>
</body>
</html>
