<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CarPlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #ddd;
    font: 18px/1.4 system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  #stage { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80%;
    padding: 18px 26px; border-radius: 14px; background: rgba(40,40,40,.85); text-align: center;
    pointer-events: none; white-space: pre-line; }
  #stats { position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 6px;
    background: rgba(0,0,0,.6); color: #8f8; font: 13px/1.3 ui-monospace, monospace; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cp-canvas" class="hidden"></canvas>
  <canvas id="cp-canvas-worker"></canvas>
</div>
<div id="msg">어댑터 연결 중…</div>
<div id="stats" class="hidden"></div>

<script src="js/protocol.js"></script>
<script src="js/video.js"></script>
<script src="js/client.js"></script>
</body>
</html>
