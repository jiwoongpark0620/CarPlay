<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarPlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #f { position: fixed; top: 0; left: 0; border: 0; transform-origin: 0 0; }
</style>
</head>
<body>
<iframe id="f" src="https://tespush.com" allow="autoplay" scrolling="no"></iframe>
<script>
  // Model Y Juniper (2026.26+): 브라우저 CSS 뷰포트 약 1254x784 (16:10)
  // 내부 페이지에 줄 레이아웃 크기. 같은 16:10 비율로 맞춰 왜곡 없이 축소.
  // 오른쪽이 잘리면 W를, 아래가 잘리면 H를 올리세요 (예: 1920x1300).
  const W = 1920;
  const H = 1200;
  // true: 비율 유지(필요 시 검은 여백) / false: 화면을 꽉 채우도록 가로·세로 따로 늘림
  const KEEP_ASPECT = true;

  const f = document.getElementById('f');
  f.style.width = W + 'px';
  f.style.height = H + 'px';

  function fit() {
    const sx = innerWidth / W, sy = innerHeight / H;
    f.style.transform = KEEP_ASPECT
      ? 'scale(' + Math.min(sx, sy) + ')'
      : 'scale(' + sx + ',' + sy + ')';
  }
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
